name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: ui/package-lock.json
    - name: Build UI
      run: cd ui && npm ci && npm run build
    - name: Build
      run: go build
    - name: Test
      run: make test

  frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: ui/package-lock.json
    - name: Install dependencies
      run: cd ui && npm ci
    - name: Lint
      run: cd ui && npm run lint
    - name: Build
      run: cd ui && npm run build
    - name: Test
      run: cd ui && npm test